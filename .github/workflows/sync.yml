name: Sync NODAL Toolkit
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toolkit-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test *.test.mjs
      - run: node sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish validated metadata
        run: |
          git config user.name 'NODAL Index Bot'
          git config user.email 'index-bot@users.noreply.github.com'
          git add data/catalog.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public resource index'
            git push
          fi
